<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compound Sentences Practice Quiz - Version 2</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}.wrap{max-width:900px;margin:auto;padding:28px 18px 60px}
.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:18px;padding:28px;margin-bottom:22px}
.hero h1{margin:0 0 8px;font-size:clamp(28px,4vw,42px)}.bar{height:12px;background:#ffffff44;border-radius:999px;overflow:hidden;margin-top:18px}.fill{height:100%;width:0;background:#fff}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 6px 20px #0000000f}.qnum{color:#2563eb;font-weight:800;font-size:14px}.q{font-size:20px;font-weight:700}
.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;border:2px solid #d1d5db;background:#fff;border-radius:12px;padding:13px 15px;font-size:16px;cursor:pointer}.opt:hover:not(:disabled){border-color:#2563eb}
.opt.correct{border-color:#15803d;background:#dcfce7}.opt.incorrect{border-color:#b91c1c;background:#fee2e2}.feedback{display:none;margin-top:14px;padding:13px 15px;border-radius:10px}.feedback.show{display:block}.feedback.correct{background:#dcfce7;color:#14532d}.feedback.incorrect{background:#fee2e2;color:#7f1d1d}.hint{margin-top:12px;border:1px dashed #cbd5e1;background:#f8fafc;padding:11px 13px;border-radius:10px;color:#475569}
.results{display:none;background:#fff;border-radius:18px;padding:28px;margin-top:24px;text-align:center}.results.show{display:block}.score{font-size:54px;font-weight:800;color:#2563eb}.btn{border:0;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;background:#2563eb;color:white;cursor:pointer}.status{margin-top:8px;font-size:14px;font-weight:700}
</style></head><body><div class="wrap">
<section class="hero"><h1>Compound Sentences Practice Quiz</h1><p>Version 2 • New questions for extra practice with independent clauses, commas, and FANBOYS.</p><div class="bar"><div id="fill" class="fill"></div></div><div id="status" class="status">0 of 12 answered</div></section>
<main id="quiz"></main>
<section id="results" class="results"><h2>Quiz Complete!</h2><div id="score" class="score"></div><p id="msg"></p><p>Review the feedback above for any questions you missed.</p><button class="btn" onclick="restartQuiz()">Try Again</button></section>
</div>
<script>
const quizData = [{"question": "Which sentence is a compound sentence?", "options": ["The puppy slept on the rug.", "The puppy slept on the rug, and the cat rested on the chair.", "Sleeping quietly on the rug.", "The sleepy puppy on the rug."], "answer": 1, "explanation": "Both parts are independent clauses joined correctly with a comma and “and.”", "hint": "Look for two complete thoughts that could each stand alone."}, {"question": "Choose the conjunction that best completes the sentence: “We wanted to go swimming, ___ the pool was closed.”", "options": ["and", "but", "so", "or"], "answer": 1, "explanation": "“But” shows the contrast between wanting to swim and the pool being closed.", "hint": "Think about the relationship between the two ideas."}, {"question": "Which sentence has the comma in the correct place?", "options": ["I finished my chores and, I went outside.", "I finished my chores, and I went outside.", "I finished, my chores and I went outside.", "I finished my chores and I, went outside."], "answer": 1, "explanation": "The comma belongs before the coordinating conjunction when it joins two independent clauses.", "hint": "Use this pattern: independent clause + comma + FANBOYS + independent clause."}, {"question": "Which choice correctly combines these sentences? “Leo studied for the test. He felt prepared.”", "options": ["Leo studied for the test, so he felt prepared.", "Leo studied for the test so, he felt prepared.", "Leo studied for the test, he felt prepared.", "Leo studied for the test, but he felt prepared."], "answer": 0, "explanation": "“So” correctly shows that feeling prepared was a result of studying.", "hint": "The second idea happens as a result of the first."}, {"question": "Which sentence is written incorrectly?", "options": ["The rain stopped, so we went outside.", "I like soccer, but my sister prefers volleyball.", "We packed our bags, we left for the airport.", "You can read a book, or you can watch a movie."], "answer": 2, "explanation": "Two independent clauses are joined with only a comma. A coordinating conjunction is needed.", "hint": "Look for two complete sentences joined with only punctuation."}, {"question": "What does FANBOYS stand for?", "options": ["for, and, nor, but, or, yet, so", "from, after, near, before, over, yes, since", "for, also, never, because, once, yet, still", "first, and, next, before, or, yesterday, soon"], "answer": 0, "explanation": "FANBOYS stands for for, and, nor, but, or, yet, so.", "hint": "Recall the coordinating conjunction list from the worksheet."}, {"question": "Choose the conjunction that best completes the sentence: “You may bring a lunch, ___ you may buy lunch at school.”", "options": ["but", "or", "so", "yet"], "answer": 1, "explanation": "“Or” connects two choices: bringing a lunch or buying one at school.", "hint": "The sentence presents two choices."}, {"question": "Which part of this sentence is the SECOND independent clause? “Carlos finished his project, and he turned it in.”", "options": ["Carlos", "finished his project", "and", "he turned it in"], "answer": 3, "explanation": "“He turned it in” has a subject and predicate and can stand alone as a complete sentence.", "hint": "Find the complete thought that comes after the conjunction."}, {"question": "Which sentence correctly uses “yet”?", "options": ["The trail was difficult, yet we continued hiking.", "The trail was difficult yet, we continued hiking.", "The trail was difficult, yet because we continued hiking.", "The trail was difficult, so yet we continued hiking."], "answer": 0, "explanation": "“Yet” correctly shows contrast, and the comma comes before the conjunction.", "hint": "Look for two complete thoughts with a contrast between them."}, {"question": "Which pair of simple sentences would be best combined with “and”?", "options": ["I was tired. I went to sleep early.", "Nora washed the dishes. Nora dried the dishes.", "We can walk. We can ride our bikes.", "The team played well. The team lost the game."], "answer": 1, "explanation": "The second sentence simply adds a related action, so “and” fits best.", "hint": "Choose the pair where the second idea adds related information."}, {"question": "Which sentence contains TWO independent clauses?", "options": ["Because the bus was late.", "The bus was late, so we arrived after the bell.", "Waiting for the bus in the rain.", "After the bus finally arrived."], "answer": 1, "explanation": "Both “The bus was late” and “we arrived after the bell” are complete thoughts.", "hint": "Check whether each side of the comma can stand alone as a sentence."}, {"question": "Which revision correctly turns these simple sentences into one compound sentence? “The sun was hot. We stayed in the shade.”", "options": ["The sun was hot, so we stayed in the shade.", "The sun was hot so, we stayed in the shade.", "The sun was hot, we stayed in the shade.", "The sun was hot, and because we stayed in the shade."], "answer": 0, "explanation": "“So” shows the cause-and-result relationship, and the clauses are joined correctly.", "hint": "The second action happened because of the first condition."}];
let score=0,answered=0,responses=Array(quizData.length).fill(null);
const quiz=document.getElementById('quiz'),fill=document.getElementById('fill'),status=document.getElementById('status'),results=document.getElementById('results');
function render(){quiz.innerHTML='';quizData.forEach((x,i)=>{let c=document.createElement('section');c.className='card';c.innerHTML=`<div class="qnum">Question ${i+1}</div><p class="q">${x.question}</p><div class="opts">${x.options.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div><div id="fb-${i}" class="feedback"></div><div class="hint"><strong>Hint:</strong> ${x.hint}</div>`;quiz.appendChild(c)});document.querySelectorAll('.opt').forEach(b=>b.onclick=answer)}
function answer(e){let b=e.currentTarget,qi=+b.dataset.q,oi=+b.dataset.o;if(responses[qi]!=null)return;responses[qi]=oi;answered++;let x=quizData[qi],card=b.closest('.card'),bs=card.querySelectorAll('.opt'),fb=document.getElementById(`fb-${qi}`);bs.forEach((z,j)=>{z.disabled=true;if(j===x.answer)z.classList.add('correct')});if(oi===x.answer){score++;fb.className='feedback show correct';fb.innerHTML='<strong>Correct!</strong> '+x.explanation}else{b.classList.add('incorrect');fb.className='feedback show incorrect';fb.innerHTML='<strong>Not quite.</strong> '+x.explanation}update();if(answered===quizData.length)finish()}
function update(){fill.style.width=(answered/quizData.length*100)+'%';status.textContent=`${answered} of ${quizData.length} answered`}
function finish(){let pct=Math.round(score/quizData.length*100);document.getElementById('score').textContent=`${score}/${quizData.length} (${pct}%)`;document.getElementById('msg').textContent=pct===100?'Excellent work — you mastered this practice set!':pct>=80?'Great job — you have a strong understanding of compound sentences.':pct>=70?'Good progress — review the missed questions and try again.':'More practice will help — focus on independent clauses, comma placement, and FANBOYS.';results.classList.add('show');results.scrollIntoView({behavior:'smooth'})}
function restartQuiz(){score=0;answered=0;responses=Array(quizData.length).fill(null);results.classList.remove('show');update();render();window.scrollTo({top:0,behavior:'smooth'})}
render();update();
</script></body></html>
