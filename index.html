<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complex Sentences Practice Quiz</title>
<style>
:root {
  --bg:#f5f7fb; --card:#fff; --ink:#172033; --muted:#667085; --border:#d8dee9;
  --accent:#2f5ea8; --good:#137333; --bad:#b3261e; --soft:#eef4ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:24px}
header{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:18px}
h1{margin:0 0 8px;font-size:2rem}
p{margin:6px 0}
.badge{display:inline-block;background:var(--soft);color:var(--accent);padding:6px 10px;border-radius:999px;font-weight:700;font-size:.9rem}
.progress-shell{height:10px;background:#e8ecf3;border-radius:999px;overflow:hidden;margin-top:16px}
#progress{height:100%;width:0;background:var(--accent);transition:.2s}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px}
.qnum{font-weight:700;color:var(--accent);font-size:.95rem}
.question{font-size:1.2rem;font-weight:700;margin:8px 0 16px}
.choice{display:block;width:100%;text-align:left;padding:13px 14px;margin:10px 0;border:1px solid var(--border);background:#fff;border-radius:10px;cursor:pointer;font-size:1rem}
.choice:hover{border-color:var(--accent);background:#f8fbff}
.choice.selected{border:2px solid var(--accent);background:var(--soft)}
.choice.correct{border:2px solid var(--good);background:#eef8f0}
.choice.wrong{border:2px solid var(--bad);background:#fff1f0}
.feedback{margin-top:14px;padding:13px;border-radius:10px;display:none}
.feedback.good{display:block;background:#eef8f0;color:#0c5d29}
.feedback.bad{display:block;background:#fff1f0;color:#8b1d17}
.controls{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
button.nav{border:0;border-radius:10px;padding:12px 18px;font-size:1rem;font-weight:700;cursor:pointer}
#checkBtn,#nextBtn,#restartBtn{background:var(--accent);color:#fff}
#prevBtn{background:#e9edf5;color:var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed}
#results{display:none;text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--accent);margin:10px 0}
.review-item{text-align:left;border-top:1px solid var(--border);padding:14px 0}
.small{color:var(--muted);font-size:.95rem}
@media (max-width:600px){.wrap{padding:12px} h1{font-size:1.6rem} .card,header{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="badge">8th Grade ELA Practice</span>
  <h1>Complex Sentences Practice Quiz</h1>
  <p>20 questions based on the skills from the class worksheets: independent and dependent clauses, subordinating conjunctions, combining ideas, and comma placement.</p>
  <div class="progress-shell"><div id="progress"></div></div>
</header>

<div id="quiz" class="card">
  <div class="qnum" id="qnum"></div>
  <div class="question" id="question"></div>
  <div id="choices"></div>
  <div id="feedback" class="feedback"></div>
  <div class="controls">
    <button class="nav" id="prevBtn">Previous</button>
    <div>
      <button class="nav" id="checkBtn">Check Answer</button>
      <button class="nav" id="nextBtn" style="display:none">Next</button>
    </div>
  </div>
</div>

<div id="results" class="card">
  <h2>Quiz Complete</h2>
  <div class="score" id="score"></div>
  <p id="message"></p>
  <div id="review"></div>
  <button class="nav" id="restartBtn">Try Again</button>
</div>
</div>

<script>
const questions = [{"q": "Which sentence is a correctly punctuated complex sentence?", "choices": ["Although the rain stopped we stayed inside.", "Although the rain stopped, we stayed inside.", "Although, the rain stopped we stayed inside.", "We stayed inside, although, the rain stopped."], "answer": 1, "explanation": "The sentence begins with the dependent clause \u201cAlthough the rain stopped,\u201d so a comma belongs before the independent clause \u201cwe stayed inside.\u201d"}, {"q": "Which part of the sentence is the dependent clause? \u201cWhen the bell rang, the students packed their bags.\u201d", "choices": ["When the bell rang", "the students packed their bags", "the students", "packed their bags"], "answer": 0, "explanation": "\u201cWhen the bell rang\u201d begins with the subordinating conjunction \u201cwhen\u201d and cannot stand alone as a complete sentence."}, {"q": "Which part of the sentence is the independent clause? \u201cBecause the road was icy, school started late.\u201d", "choices": ["Because the road was icy", "Because the road", "school started late", "was icy"], "answer": 2, "explanation": "\u201cSchool started late\u201d expresses a complete thought and can stand by itself."}, {"q": "Which word is the subordinating conjunction in this sentence? \u201cWe waited inside until the storm passed.\u201d", "choices": ["inside", "until", "storm", "passed"], "answer": 1, "explanation": "\u201cUntil\u201d introduces the dependent clause \u201cuntil the storm passed.\u201d"}, {"q": "Choose the best subordinating conjunction: \u201c_____ Mia had finished her homework, she went outside to play.\u201d", "choices": ["After", "Unless", "Although", "Whereas"], "answer": 0, "explanation": "\u201cAfter\u201d clearly shows that finishing the homework happened before Mia went outside."}, {"q": "Which sentence uses the comma correctly?", "choices": ["Before we leave, we need to lock the door.", "Before, we leave we need to lock the door.", "Before we leave we need, to lock the door.", "Before, we leave, we need to lock the door."], "answer": 0, "explanation": "When a dependent clause comes first, place a comma after the entire dependent clause."}, {"q": "Which sentence is punctuated correctly?", "choices": ["I will call you, when I get home.", "I will call you when I get home.", "I will, call you when I get home.", "I will call you when, I get home."], "answer": 1, "explanation": "The independent clause comes first, so a comma is generally not needed before the dependent clause \u201cwhen I get home.\u201d"}, {"q": "Which sentence is NOT a complete complex sentence?", "choices": ["Although the team practiced every day.", "Although the team practiced every day, they were nervous before the game.", "They were nervous before the game although the team practiced every day.", "Even though it was difficult, the team kept practicing."], "answer": 0, "explanation": "\u201cAlthough the team practiced every day\u201d is only a dependent clause. It needs an independent clause to complete the thought."}, {"q": "Choose the best word to combine these ideas: \u201cThe puppy is cute. Raising a puppy takes a lot of work.\u201d", "choices": ["Although the puppy is cute, raising a puppy takes a lot of work.", "Whenever the puppy is cute, raising a puppy takes a lot of work.", "Before the puppy is cute, raising a puppy takes a lot of work.", "Until the puppy is cute, raising a puppy takes a lot of work."], "answer": 0, "explanation": "\u201cAlthough\u201d shows the contrast between the puppy being cute and the work required to raise it."}, {"q": "Which sentence correctly uses \u201cunless\u201d?", "choices": ["Unless, you charge the tablet it will turn off.", "Unless you charge the tablet, it will turn off.", "You will charge the tablet unless, it turns off.", "Unless you charge, the tablet it will turn off."], "answer": 1, "explanation": "\u201cUnless you charge the tablet\u201d is an introductory dependent clause, so it is followed by a comma."}, {"q": "Which sentence best combines the ideas? \u201cThe movie started. We found our seats.\u201d", "choices": ["Before the movie started, we found our seats.", "Unless the movie started, we found our seats.", "Although the movie started, because we found our seats.", "Wherever the movie started, we found our seats."], "answer": 0, "explanation": "\u201cBefore\u201d correctly shows the time relationship: finding the seats happened before the movie started."}, {"q": "Which sentence contains one independent clause and one dependent clause?", "choices": ["The dog barked loudly.", "The dog barked, and the baby woke up.", "When the dog barked, the baby woke up.", "Barking loudly near the baby."], "answer": 2, "explanation": "\u201cWhen the dog barked\u201d is dependent, and \u201cthe baby woke up\u201d is independent, making the sentence complex."}, {"q": "Choose the best subordinating conjunction: \u201cWe will stay at the park _____ it begins to rain.\u201d", "choices": ["until", "although", "whereas", "as if"], "answer": 0, "explanation": "\u201cUntil\u201d shows that the rain would mark the point when staying at the park ends."}, {"q": "Which version is correctly punctuated?", "choices": ["Even though Carlos was tired he finished his project.", "Even though Carlos was tired, he finished his project.", "Even though, Carlos was tired, he finished his project.", "Even, though Carlos was tired he finished his project."], "answer": 1, "explanation": "The introductory dependent clause \u201cEven though Carlos was tired\u201d must be followed by a comma."}, {"q": "Which sentence has a punctuation error?", "choices": ["Whenever you are ready, we can begin.", "We can begin whenever you are ready.", "While the cookies bake, we can clean the kitchen.", "We can clean the kitchen, while the cookies bake."], "answer": 3, "explanation": "When the independent clause comes first, a comma is generally not used before the dependent clause \u201cwhile the cookies bake.\u201d"}, {"q": "A student writes: \u201cThe athletes traveled across the world there was a chance they would not win a medal.\u201d Which revision best creates a complex sentence?", "choices": ["Although the athletes traveled across the world, there was a chance they would not win a medal.", "The athletes traveled across the world, and there was a chance they would not win a medal.", "The athletes traveled across the world, there was a chance they would not win a medal.", "The athletes traveled across the world but."], "answer": 0, "explanation": "\u201cAlthough\u201d turns the first idea into a dependent clause and creates a correctly punctuated complex sentence."}, {"q": "Which sentence correctly uses \u201cas soon as\u201d?", "choices": ["As soon as the bus arrives, we will leave.", "As soon as, the bus arrives we will leave.", "We will leave, as soon as the bus arrives.", "As soon, as the bus arrives, we will leave."], "answer": 0, "explanation": "\u201cAs soon as the bus arrives\u201d is an introductory dependent clause, so it is followed by a comma."}, {"q": "Which statement about complex sentences is true?", "choices": ["A complex sentence has two independent clauses and no dependent clause.", "A complex sentence has at least one independent clause and at least one dependent clause.", "A complex sentence must always begin with a dependent clause.", "A complex sentence can never contain a comma."], "answer": 1, "explanation": "A complex sentence contains at least one independent clause and at least one dependent clause."}, {"q": "Choose the sentence that correctly combines the ideas: \u201cJen was upset. She continued to cheer for her team.\u201d", "choices": ["Although Jen was upset, she continued to cheer for her team.", "Although, Jen was upset she continued to cheer for her team.", "Jen was upset, although, she continued to cheer for her team.", "Although Jen was upset."], "answer": 0, "explanation": "\u201cAlthough\u201d shows contrast, and the introductory dependent clause is correctly followed by a comma."}, {"q": "Which sentence is a correctly written complex sentence?", "choices": ["Now that, we know where the keys are we can leave.", "Now that we know where the keys are, we can leave.", "We can leave, now that we know where the keys are.", "Now that we know where the keys are."], "answer": 1, "explanation": "\u201cNow that we know where the keys are\u201d is a dependent clause at the beginning, so it is followed by a comma and then a complete independent clause."}];
let current = 0;
let answers = Array(questions.length).fill(null);
let checked = Array(questions.length).fill(false);

const qnum = document.getElementById('qnum');
const questionEl = document.getElementById('question');
const choicesEl = document.getElementById('choices');
const feedbackEl = document.getElementById('feedback');
const progress = document.getElementById('progress');
const prevBtn = document.getElementById('prevBtn');
const checkBtn = document.getElementById('checkBtn');
const nextBtn = document.getElementById('nextBtn');

function render() {
  const q = questions[current];
  qnum.textContent = `Question ${current+1} of ${questions.length}`;
  questionEl.textContent = q.q;
  progress.style.width = `${(current/questions.length)*100}%`;
  choicesEl.innerHTML = '';
  feedbackEl.className = 'feedback';
  feedbackEl.textContent = '';

  q.choices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className='choice';
    b.textContent = String.fromCharCode(65+i) + ') ' + c;
    if (answers[current] === i) b.classList.add('selected');
    if (checked[current]) {
      b.disabled = true;
      if (i === q.answer) b.classList.add('correct');
      if (answers[current] === i && i !== q.answer) b.classList.add('wrong');
    }
    b.onclick=()=>{
      if (checked[current]) return;
      answers[current]=i;
      render();
    };
    choicesEl.appendChild(b);
  });

  if (checked[current]) {
    const correct = answers[current] === q.answer;
    feedbackEl.className = 'feedback ' + (correct ? 'good' : 'bad');
    feedbackEl.textContent = (correct ? 'Nice work. ' : 'Not quite. ') + q.explanation;
    checkBtn.style.display='none';
    nextBtn.style.display='inline-block';
    nextBtn.textContent = current === questions.length-1 ? 'See Results' : 'Next';
  } else {
    checkBtn.style.display='inline-block';
    nextBtn.style.display='none';
  }
  checkBtn.disabled = answers[current] === null;
  prevBtn.disabled = current === 0;
}

checkBtn.onclick=()=>{
  if (answers[current]===null) return;
  checked[current]=true;
  render();
};
nextBtn.onclick=()=>{
  if (current === questions.length-1) showResults();
  else { current++; render(); }
};
prevBtn.onclick=()=>{ if(current>0){current--;render();} };

function showResults(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('results').style.display='block';
  progress.style.width='100%';
  const correctCount = questions.reduce((n,q,i)=>n+(answers[i]===q.answer?1:0),0);
  const pct = Math.round(correctCount/questions.length*100);
  document.getElementById('score').textContent = `${correctCount} / ${questions.length} (${pct}%)`;
  let msg = pct>=90 ? 'Excellent — the complex sentence rules look strong.' :
            pct>=80 ? 'Good work — review the few items you missed.' :
            pct>=70 ? 'You are getting there. Review comma placement and subordinating conjunctions.' :
                      'More practice will help. Focus on independent/dependent clauses and the comma rule.';
  document.getElementById('message').textContent = msg;

  const review = document.getElementById('review');
  review.innerHTML='<h3>Review</h3>';
  questions.forEach((q,i)=>{
    const div=document.createElement('div');
    div.className='review-item';
    const user = answers[i]===null ? 'No answer' : q.choices[answers[i]];
    const correct = q.choices[q.answer];
    div.innerHTML = `<strong>${i+1}. ${q.q}</strong><br>
      <span class="${answers[i]===q.answer?'':'small'}">Your answer: ${user}</span><br>
      <span>Correct answer: ${correct}</span><br>
      <span class="small">${q.explanation}</span>`;
    review.appendChild(div);
  });
}

document.getElementById('restartBtn').onclick=()=>{
  current=0; answers=Array(questions.length).fill(null); checked=Array(questions.length).fill(false);
  document.getElementById('results').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
};
render();
</script>
</body>
</html>
