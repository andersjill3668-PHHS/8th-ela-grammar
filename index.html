<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complex Sentences Quiz V2</title>
<style>body{font-family:Arial;background:#f5f7fb;color:#172033;margin:0}main{max-width:850px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d8dee8;border-radius:14px;padding:22px;margin-bottom:15px}.tag{font-weight:bold;color:#315f9f}.bar{height:9px;background:#e7eaf0;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#315f9f}.choice{width:100%;text-align:left;padding:13px;margin:7px 0;border:1px solid #d8dee8;border-radius:9px;background:#fff;font-size:16px}.sel{border:2px solid #315f9f;background:#eef4fb}.right{border:2px solid #18753c;background:#edf8f0}.wrong{border:2px solid #b42318;background:#fff0ef}.fb{padding:12px;margin-top:12px;border-radius:8px}.good{background:#edf8f0}.bad{background:#fff0ef}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.btn{padding:11px 16px;border:0;border-radius:9px;font-weight:bold}.primary{background:#315f9f;color:white}.secondary{background:#e8ecf3}.review{text-align:left;border-top:1px solid #ddd;padding:12px 0}.muted{color:#667085}</style></head><body><main>
<div class="card"><div class="tag">8th Grade ELA • Version 2</div><h1>Complex Sentences</h1><p>20 new questions following the teacher study guide.</p><p class="muted">Part 1: Identify subordinating conjunctions • Part 2: Correct comma placement</p><div class="bar"><div id="bar"></div></div></div>
<div id="quiz" class="card"><b id="num"></b><h2 id="q"></h2><div id="choices"></div><div id="fb"></div><div class="actions"><button class="btn secondary" id="prev">Previous</button><div><button class="btn primary" id="check">Check Answer</button> <button class="btn primary" id="next" hidden>Next</button></div></div></div>
<div id="results" class="card" hidden><h2>Quiz Complete</h2><h1 id="score"></h1><p id="msg"></p><div id="review"></div><button class="btn primary" id="retry">Retry Quiz</button></div>
<script>const Q=[{"q": "Identify the subordinating conjunction: \u201cAlthough Mia practiced daily, she still felt nervous.\u201d", "c": ["Although", "practiced", "daily", "still"], "a": 0, "e": "Although introduces the dependent clause and shows contrast."}, {"q": "Identify the subordinating conjunction: \u201cThe screen dimmed when the battery became low.\u201d", "c": ["screen", "dimmed", "when", "battery"], "a": 2, "e": "When introduces the dependent clause and shows time."}, {"q": "Identify the subordinating conjunction: \u201cUnless the weather improves, practice will move indoors.\u201d", "c": ["Unless", "weather", "practice", "indoors"], "a": 0, "e": "Unless introduces a condition."}, {"q": "Identify the subordinating conjunction: \u201cWe stayed after school because our project needed more work.\u201d", "c": ["stayed", "because", "project", "work"], "a": 1, "e": "Because introduces the reason."}, {"q": "Identify the subordinating conjunction: \u201cWhile the class examined the rocks, Mr. Lee recorded observations.\u201d", "c": ["While", "class", "examined", "recorded"], "a": 0, "e": "While introduces a dependent clause and shows time."}, {"q": "Identify the subordinating conjunction: \u201cThe festival continued even though it began to rain.\u201d", "c": ["continued", "even though", "began", "rain"], "a": 1, "e": "Even though introduces contrast."}, {"q": "Identify the subordinating conjunction: \u201cAs long as you return the form, you may attend the trip.\u201d", "c": ["As long as", "return", "form", "attend"], "a": 0, "e": "As long as introduces a condition."}, {"q": "Identify the subordinating conjunction: \u201cThe crowd cheered when the final point was scored.\u201d", "c": ["crowd", "cheered", "when", "final"], "a": 2, "e": "When introduces the dependent clause."}, {"q": "Identify the subordinating conjunction: \u201cBefore the doors opened, the workers checked the displays.\u201d", "c": ["Before", "doors", "workers", "checked"], "a": 0, "e": "Before introduces a time relationship."}, {"q": "Identify the subordinating conjunction: \u201cLeo practiced until he could perform the song from memory.\u201d", "c": ["practiced", "until", "perform", "memory"], "a": 1, "e": "Until introduces the dependent clause and shows how long Leo practiced."}, {"q": "Which sentence is punctuated correctly?", "c": ["Before first period begins students should report to class.", "Before first period begins, students should report to class.", "Before, first period begins students should report to class.", "Before first period, begins students should report to class."], "a": 1, "e": "The dependent clause comes first, so a comma follows the complete dependent clause."}, {"q": "Which sentence is punctuated correctly?", "c": ["We will start practice when the coach arrives.", "We will start practice, when the coach arrives.", "We will, start practice when the coach arrives.", "We will start practice when, the coach arrives."], "a": 0, "e": "The independent clause comes first, so the class rule does not require a comma before the dependent clause."}, {"q": "Which sentence is punctuated correctly?", "c": ["If you want to join the team you must attend tryouts.", "If, you want to join the team you must attend tryouts.", "If you want to join the team, you must attend tryouts.", "If you want, to join the team you must attend tryouts."], "a": 2, "e": "The introductory dependent clause is followed by a comma."}, {"q": "Which sentence is punctuated correctly?", "c": ["Since the library added more tables, more students study there.", "Since, the library added more tables more students study there.", "Since the library added more tables more students, study there.", "Since the library, added more tables more students study there."], "a": 0, "e": "The dependent clause beginning with Since comes first and is followed by a comma."}, {"q": "Which sentence is punctuated correctly?", "c": ["Whenever the drama club holds auditions, many students participate.", "Whenever, the drama club holds auditions many students participate.", "Whenever the drama club, holds auditions many students participate.", "Whenever the drama club holds auditions many students, participate."], "a": 0, "e": "The introductory dependent clause is correctly followed by a comma."}, {"q": "Which sentence is punctuated correctly?", "c": ["Although the assignment had several steps, Jordan finished early.", "Although, the assignment had several steps Jordan finished early.", "Although the assignment had several steps Jordan, finished early.", "Although the assignment, had several steps Jordan finished early."], "a": 0, "e": "The dependent clause comes first, so a comma belongs after steps."}, {"q": "Which sentence is already correct and needs NO comma added?", "c": ["While the oven heats we can prepare dinner.", "We can prepare dinner while the oven heats.", "Unless you hurry you will miss the bus.", "Before the meeting begins everyone should sit down."], "a": 1, "e": "The independent clause comes first, so no comma is required before the following dependent clause under the class rule."}, {"q": "Where should the comma go? \u201cAs long as the sky remains clear we will practice outside.\u201d", "c": ["After \u201cAs\u201d", "After \u201csky\u201d", "After \u201cclear\u201d", "No comma"], "a": 2, "e": "The complete introductory dependent clause ends with clear."}, {"q": "Where should the comma go? \u201cWhile the judges reviewed the projects the students waited quietly.\u201d", "c": ["After \u201cWhile\u201d", "After \u201cprojects\u201d", "After \u201cstudents\u201d", "No comma"], "a": 1, "e": "The introductory dependent clause ends with projects."}, {"q": "Which sentence follows BOTH study-guide rules?", "c": ["Even though the water was cold, the swimmers finished practice.", "Even though, the water was cold the swimmers finished practice.", "The swimmers finished practice, even though the water was cold.", "Even though the water was cold."], "a": 0, "e": "Even though introduces the dependent clause, and because that clause comes first, a comma follows it."}];let i=0,A=Array(Q.length).fill(null),C=Array(Q.length).fill(false);const g=x=>document.getElementById(x);
function draw(){let x=Q[i];g('num').textContent=`Question ${i+1} of ${Q.length} • ${i<10?'Part 1: Conjunctions':'Part 2: Punctuation'}`;g('q').textContent=x.q;g('bar').style.width=(i/Q.length*100)+'%';g('choices').innerHTML='';g('fb').innerHTML='';g('fb').className='';
x.c.forEach((t,j)=>{let b=document.createElement('button');b.className='choice'+(A[i]===j?' sel':'');b.textContent=String.fromCharCode(65+j)+') '+t;if(C[i]){b.disabled=true;if(j===x.a)b.classList.add('right');if(A[i]===j&&j!==x.a)b.classList.add('wrong')}b.onclick=()=>{if(!C[i]){A[i]=j;draw()}};g('choices').appendChild(b)});
if(C[i]){let ok=A[i]===x.a;g('fb').className='fb '+(ok?'good':'bad');g('fb').textContent=(ok?'Correct. ':'Not quite. ')+x.e;g('check').hidden=true;g('next').hidden=false;g('next').textContent=i===Q.length-1?'See Results':'Next'}else{g('check').hidden=false;g('next').hidden=true}g('check').disabled=A[i]===null;g('prev').disabled=i===0}
g('check').onclick=()=>{if(A[i]!==null){C[i]=true;draw()}};g('next').onclick=()=>{if(i<Q.length-1){i++;draw()}else finish()};g('prev').onclick=()=>{if(i){i--;draw()}};
function finish(){g('quiz').hidden=true;g('results').hidden=false;g('bar').style.width='100%';let n=Q.reduce((s,x,k)=>s+(A[k]===x.a),0),p=Math.round(n/Q.length*100);g('score').textContent=`${n} / ${Q.length} (${p}%)`;g('msg').textContent=p>=90?'Strong work. The study-guide skills look solid.':p>=80?'Good progress. Review the missed questions and try again.':'Review the conjunction and comma rules below, then retry.';g('review').innerHTML='<h3>Answer Review</h3>';Q.forEach((x,k)=>{let d=document.createElement('div');d.className='review';d.innerHTML=`<b>${k+1}. ${x.q}</b><br>Your answer: ${A[k]===null?'No answer':x.c[A[k]]}<br><b>Correct:</b> ${x.c[x.a]}<br><span class="muted">${x.e}</span>`;g('review').appendChild(d)})}
g('retry').onclick=()=>{i=0;A=Array(Q.length).fill(null);C=Array(Q.length).fill(false);g('results').hidden=true;g('quiz').hidden=false;draw()};draw();</script></main></body></html>
