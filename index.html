<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complex Sentences Practice</title>
<style>body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:850px;margin:auto;padding:20px}.box{background:white;border:1px solid #d9dee8;border-radius:14px;padding:22px;margin-bottom:16px}h1{margin-top:0}.small{color:#667085}.bar{height:9px;background:#e8ebf1;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#315f9f}.choice{width:100%;text-align:left;padding:13px;margin:7px 0;border:1px solid #d9dee8;border-radius:9px;background:white;font-size:16px}.sel{border:2px solid #315f9f;background:#eef4fb}.right{border:2px solid #18753c;background:#edf8f0}.wrong{border:2px solid #b42318;background:#fff0ef}.fb{padding:12px;border-radius:8px;margin-top:12px}.good{background:#edf8f0}.bad{background:#fff0ef}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.btn{padding:11px 16px;border:0;border-radius:9px;font-weight:bold}.primary{background:#315f9f;color:white}.secondary{background:#e8ebf1}.review{text-align:left;border-top:1px solid #ddd;padding:12px 0}</style></head>
<body><main><div class="box"><h1>Complex Sentences</h1><p>Teacher Study Guide Practice • 20 Questions</p><p class="small">Focus: subordinating conjunctions and comma placement in complex sentences.</p><div class="bar"><div id="bar"></div></div></div>
<div id="quiz" class="box"><b id="num"></b><h2 id="q"></h2><div id="choices"></div><div id="fb"></div><div class="actions"><button class="btn secondary" id="prev">Previous</button><div><button class="btn primary" id="check">Check Answer</button> <button class="btn primary" id="next" hidden>Next</button></div></div></div>
<div id="results" class="box" hidden><h2>Quiz Complete</h2><h1 id="score"></h1><p id="msg"></p><div id="review"></div><button class="btn primary" id="retry">Retry Quiz</button></div>
<script>const Q=[{"q": "Which word or phrase is the subordinating conjunction? “Although Elena felt nervous, she delivered a strong presentation.”", "c": ["Although", "nervous", "delivered", "strong"], "a": 0, "e": "“Although” introduces the dependent clause and shows contrast."}, {"q": "Which word is the subordinating conjunction? “The laptop shut down when its battery ran out.”", "c": ["laptop", "when", "battery", "ran"], "a": 1, "e": "“When” introduces the dependent clause and shows a time relationship."}, {"q": "Which word is the subordinating conjunction? “Unless the roads freeze overnight, school will open on time.”", "c": ["Unless", "roads", "overnight", "will"], "a": 0, "e": "“Unless” introduces a condition."}, {"q": "Which word is the subordinating conjunction? “The coach added another practice because the tournament begins Saturday.”", "c": ["coach", "another", "because", "Saturday"], "a": 2, "e": "“Because” introduces the dependent clause and explains the reason."}, {"q": "Which word is the subordinating conjunction? “While the students examined the samples, the teacher recorded their observations.”", "c": ["While", "examined", "teacher", "their"], "a": 0, "e": "“While” introduces the dependent clause and shows a time relationship."}, {"q": "Which phrase is the subordinating conjunction? “The park remained crowded even though the temperature was very high.”", "c": ["remained", "even though", "temperature", "very high"], "a": 1, "e": "“Even though” introduces the dependent clause and shows contrast."}, {"q": "Which phrase is the subordinating conjunction? “As long as you finish the assignment tonight, you may attend the game tomorrow.”", "c": ["As long as", "finish", "tonight", "tomorrow"], "a": 0, "e": "“As long as” introduces a condition."}, {"q": "Which word is the subordinating conjunction? “The fans celebrated when their team scored the final goal.”", "c": ["fans", "celebrated", "when", "final"], "a": 2, "e": "“When” introduces the dependent clause and tells when the fans celebrated."}, {"q": "Which word is the subordinating conjunction? “Before the new computers arrived, students shared the older machines.”", "c": ["Before", "new", "students", "older"], "a": 0, "e": "“Before” introduces the dependent clause and shows time."}, {"q": "Which word is the subordinating conjunction? “Sofia practiced her speech until she could deliver it without notes.”", "c": ["practiced", "speech", "until", "without"], "a": 2, "e": "“Until” introduces the dependent clause and shows how long Sofia practiced."}, {"q": "Which sentence is punctuated correctly?", "c": ["Before the bus arrives we need to be ready.", "Before the bus arrives, we need to be ready.", "Before, the bus arrives we need to be ready.", "Before the bus, arrives we need to be ready."], "a": 1, "e": "The dependent clause comes first, so a comma belongs after the complete dependent clause."}, {"q": "Which sentence is punctuated correctly?", "c": ["We need to be ready before the bus arrives.", "We need to be ready, before the bus arrives.", "We need, to be ready before the bus arrives.", "We need to be ready before, the bus arrives."], "a": 0, "e": "The independent clause comes first, so the worksheet rule does not require a comma before the dependent clause."}, {"q": "Which sentence is punctuated correctly?", "c": ["If you want to improve your grade you should study tonight.", "If, you want to improve your grade, you should study tonight.", "If you want to improve your grade, you should study tonight.", "If you want, to improve your grade you should study tonight."], "a": 2, "e": "The introductory dependent clause is followed by a comma."}, {"q": "Which sentence is punctuated correctly?", "c": ["Since the library extended its hours, more students study there.", "Since, the library extended its hours more students study there.", "Since the library extended its hours more students, study there.", "Since the library, extended its hours more students study there."], "a": 0, "e": "The dependent clause comes first, so a comma separates it from the independent clause."}, {"q": "Which sentence is punctuated correctly?", "c": ["Whenever the club announces a meeting, members check their schedules.", "Whenever, the club announces a meeting members check their schedules.", "Whenever the club announces a meeting members, check their schedules.", "Whenever the club, announces a meeting members check their schedules."], "a": 0, "e": "The introductory dependent clause is correctly followed by a comma."}, {"q": "Which sentence is punctuated correctly?", "c": ["Although the test covered several chapters Mia felt prepared.", "Although the test covered several chapters, Mia felt prepared.", "Although, the test covered several chapters Mia felt prepared.", "Although the test, covered several chapters Mia felt prepared."], "a": 1, "e": "The dependent clause comes first, so a comma belongs after “chapters.”"}, {"q": "Which sentence is already correct and needs NO comma added?", "c": ["When practice ends we will go home.", "We will go home when practice ends.", "Unless you hurry you will miss the bus.", "Although the rain stopped we stayed inside."], "a": 1, "e": "The independent clause comes first, so no comma is required before the following dependent clause under the class rule."}, {"q": "Where should the comma go? “As soon as the doors open we will find our seats.”", "c": ["After “As”", "After “soon”", "After “open”", "After “will”"], "a": 2, "e": "The complete dependent clause is “As soon as the doors open,” so the comma belongs after “open.”"}, {"q": "Where should the comma go? “Even though the trail was difficult the hikers reached the top.”", "c": ["After “though”", "After “trail”", "After “difficult”", "No comma is needed"], "a": 2, "e": "The introductory dependent clause ends with “difficult,” so the comma follows it."}, {"q": "Which sentence best follows BOTH study-guide rules?", "c": ["Unless you finish your project, you cannot play the game.", "Unless, you finish your project you cannot play the game.", "You cannot play the game, unless you finish your project.", "Unless you finish your project."], "a": 0, "e": "“Unless” correctly introduces the dependent clause, and the introductory dependent clause is followed by a comma."}];let i=0,A=Array(Q.length).fill(null),D=Array(Q.length).fill(false);const g=x=>document.getElementById(x);
function draw(){let x=Q[i];g('num').textContent=`Question ${i+1} of ${Q.length}`;g('q').textContent=x.q;g('bar').style.width=(i/Q.length*100)+'%';g('choices').innerHTML='';g('fb').innerHTML='';g('fb').className='';
x.c.forEach((t,j)=>{let b=document.createElement('button');b.className='choice'+(A[i]===j?' sel':'');b.textContent=String.fromCharCode(65+j)+') '+t;if(D[i]){b.disabled=true;if(j===x.a)b.classList.add('right');if(A[i]===j&&j!==x.a)b.classList.add('wrong')}b.onclick=()=>{if(!D[i]){A[i]=j;draw()}};g('choices').appendChild(b)});
if(D[i]){let ok=A[i]===x.a;g('fb').className='fb '+(ok?'good':'bad');g('fb').textContent=(ok?'Correct. ':'Not quite. ')+x.e;g('check').hidden=true;g('next').hidden=false;g('next').textContent=i===Q.length-1?'See Results':'Next'}else{g('check').hidden=false;g('next').hidden=true}g('check').disabled=A[i]===null;g('prev').disabled=i===0}
g('check').onclick=()=>{D[i]=true;draw()};g('next').onclick=()=>{if(i<Q.length-1){i++;draw()}else finish()};g('prev').onclick=()=>{if(i){i--;draw()}};
function finish(){g('quiz').hidden=true;g('results').hidden=false;g('bar').style.width='100%';let n=Q.reduce((s,x,k)=>s+(A[k]===x.a),0),p=Math.round(n/Q.length*100);g('score').textContent=`${n} / ${Q.length} (${p}%)`;g('msg').textContent=p>=90?'Strong work. The study-guide skills look solid.':p>=80?'Good progress. Review the missed questions and try again.':'Review the subordinating conjunctions and comma rule below, then retry.';g('review').innerHTML='<h3>Answer Review</h3>';Q.forEach((x,k)=>{let d=document.createElement('div');d.className='review';d.innerHTML=`<b>${k+1}. ${x.q}</b><br>Your answer: ${A[k]===null?'No answer':x.c[A[k]]}<br><b>Correct:</b> ${x.c[x.a]}<br><span class="small">${x.e}</span>`;g('review').appendChild(d)})}
g('retry').onclick=()=>{i=0;A=Array(Q.length).fill(null);D=Array(Q.length).fill(false);g('results').hidden=true;g('quiz').hidden=false;draw()};draw();</script></main></body></html>
