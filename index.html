<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Compound Sentences Study Guide Quiz</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#1f2937}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:28px;border-radius:18px}.hero h1{margin:0 0 8px}.rule{background:#ffffff2b;padding:10px 12px;border-radius:10px;margin-top:14px;font-weight:700}.progress{height:12px;background:#ffffff44;border-radius:999px;overflow:hidden;margin-top:16px}.fill{height:100%;background:#fff;width:0}.status{font-weight:700;font-size:14px;margin-top:7px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #0000000d}.num{font-size:13px;font-weight:800;color:#2563eb;text-transform:uppercase}.q{font-size:20px;font-weight:700}.options{display:grid;gap:10px}.option{border:2px solid #d1d5db;border-radius:11px;background:#fff;padding:13px 14px;text-align:left;font-size:16px;cursor:pointer}.option:hover:not(:disabled){border-color:#2563eb}.option.correct{background:#dcfce7;border-color:#16a34a;color:#166534;font-weight:700}.option.wrong{background:#fee2e2;border-color:#dc2626;color:#991b1b;font-weight:700}.feedback{display:none;margin-top:13px;padding:12px 14px;border-radius:10px}.feedback.show{display:block}.feedback.good{background:#dcfce7;color:#166534}.feedback.bad{background:#fee2e2;color:#991b1b}.results{display:none;background:#fff;border-radius:18px;padding:28px;text-align:center;margin-top:22px}.results.show{display:block}.score{font-size:52px;font-weight:800;color:#2563eb}.retry{border:0;border-radius:10px;background:#2563eb;color:white;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
</style></head><body><div class="wrap"><section class="hero"><h1>Compound Sentences Practice Quiz</h1><p>20 questions based on the teacher-provided study guide.</p><div class="rule">Remember: Independent clause + comma + FANBOYS + independent clause.</div><div class="progress"><div id="fill" class="fill"></div></div><div id="status" class="status">0 of 20 answered</div></section><main id="quiz"></main><section id="results" class="results"><h2>Quiz Complete!</h2><div id="score" class="score"></div><p id="message"></p><p>Review any missed questions above, then try again.</p><button class="retry" onclick="restart()">Try Again</button></section></div>
<script>
const questions=[{"question": "Which sentence is a compound sentence?", "options": ["The power went out, yet the backup generator kept running.", "Neither the coach nor the players expected the delay.", "The bright lights above the field flickered all night.", "Running across the parking lot after practice."], "answer": 0, "explanation": "A compound sentence has two independent clauses. Both parts can stand alone, and they are joined by comma + yet."}, {"question": "Which sentence is SIMPLE even though it has a compound subject?", "options": ["Mia finished the poster, and Ava printed the handouts.", "Neither Marcus nor Jordan remembered the permission slip.", "The bell rang, so the students packed their bags.", "The rain stopped, but the field remained muddy."], "answer": 1, "explanation": "“Neither Marcus nor Jordan” is a compound subject, but the sentence has only one independent clause."}, {"question": "Which sentence is a compound sentence?", "options": ["The director edited the film and added new music.", "The director edited the film, but the producer requested another change.", "The director and producer reviewed the film.", "The carefully edited film won an award."], "answer": 1, "explanation": "Both sides of “but” are complete independent clauses."}, {"question": "Which sentence is SIMPLE because it has a compound object rather than two independent clauses?", "options": ["The archaeologists uncovered trenches and stone walls.", "The archaeologists uncovered trenches, and the students photographed them.", "The team mapped the site, but rain ended the work.", "The sun set, so the group returned to camp."], "answer": 0, "explanation": "“Trenches and stone walls” is a compound object. There is only one independent clause."}, {"question": "Which sentence contains two independent clauses joined correctly?", "options": ["The report is due Friday or Monday.", "The report is due Friday, or the entire team will lose points.", "The report is due Friday and must be typed.", "Due Friday and worth fifty points."], "answer": 1, "explanation": "Both parts are independent clauses joined with comma + or."}, {"question": "Which sentence is SIMPLE even though it has a compound predicate?", "options": ["The birds migrated south and built nests near the river.", "The birds migrated south, and the geese remained near the lake.", "The weather changed, so the birds left early.", "The birds returned, but the lake was still frozen."], "answer": 0, "explanation": "The one subject, “The birds,” performs two actions: migrated and built."}, {"question": "Which sentence is a compound sentence?", "options": ["The original schedule and the revised schedule are on the desk.", "The original schedule lists Friday and Saturday.", "The original schedule lists Friday, but the revised schedule lists Saturday.", "The original and revised schedules list different dates."], "answer": 2, "explanation": "The sentence has two complete thoughts joined with comma + but."}, {"question": "Which sentence is SIMPLE even though it contains two verbs?", "options": ["The clock chimed and remained loud throughout the hall.", "The clock chimed, and the students looked up.", "The clock stopped, so the teacher checked the time.", "The clock chimed, but no one moved."], "answer": 0, "explanation": "The single subject “The clock” has a compound predicate: chimed and remained."}, {"question": "Which sentence is punctuated correctly?", "options": ["The experiment produced unexpected results but, the team published them.", "The experiment produced unexpected results, but the team published them.", "The experiment, produced unexpected results but the team published them.", "The experiment produced unexpected results, the team published them."], "answer": 1, "explanation": "Two independent clauses joined by a FANBOYS conjunction require a comma before the conjunction."}, {"question": "Which sentence correctly uses comma + so?", "options": ["The laptop was too old to run the program so, Elena used a newer one.", "The laptop was too old to run the program, so Elena used a newer one.", "The laptop was too old, to run the program so Elena used a newer one.", "The laptop was too old to run the program, Elena used a newer one."], "answer": 1, "explanation": "Both sides are independent clauses, so the comma belongs before “so.”"}, {"question": "Which sentence does NOT need a comma before “and”?", "options": ["The actor dropped his script and picked it up quickly.", "The actor dropped his script, and the director stopped rehearsal.", "The actor forgot his line, and the audience grew quiet.", "The actor bowed, and the crowd applauded."], "answer": 0, "explanation": "The subject “The actor” performs both actions. This is a compound predicate, so no comma is needed."}, {"question": "Which sentence is punctuated correctly with “for”?", "options": ["The community center will stay open late for, residents need a place to meet.", "The community center will stay open late, for residents need a place to meet.", "The community center, will stay open late for residents need a place to meet.", "The community center will stay open late for residents, need a place to meet."], "answer": 1, "explanation": "Here “for” is a coordinating conjunction meaning “because,” and it joins two independent clauses."}, {"question": "Which sentence correctly uses “yet” to join two independent clauses?", "options": ["The trail was steep yet, the hikers kept climbing.", "The trail was steep, yet the hikers kept climbing.", "The trail was, steep yet the hikers kept climbing.", "The trail was steep, the hikers kept climbing."], "answer": 1, "explanation": "A comma comes before “yet” when it joins two independent clauses."}, {"question": "Which sentence correctly uses “or” to join two independent clauses?", "options": ["The school board must approve the budget or, several programs may be cut.", "The school board must approve the budget, or several programs may be cut.", "The school board, must approve the budget or several programs may be cut.", "The school board must approve the budget, several programs may be cut."], "answer": 1, "explanation": "Both parts are complete sentences, so comma + or correctly joins them."}, {"question": "Which sentence does NOT need a comma because the second part lacks its own subject?", "options": ["The teacher explained the directions and provided a step-by-step example.", "The teacher explained the directions, and the students took notes.", "The teacher gave an example, but several students were confused.", "The teacher repeated the directions, so everyone understood."], "answer": 0, "explanation": "“Provided a step-by-step example” has no new subject. It is part of a compound predicate."}, {"question": "Which sentence correctly uses “nor”?", "options": ["Maya did not finish her lab report nor, did she clean her station.", "Maya did not finish her lab report, nor did she clean her station.", "Maya did not finish, her lab report nor did she clean her station.", "Maya did not finish her lab report, nor cleaning her station."], "answer": 1, "explanation": "The construction is correctly joined by comma + nor."}, {"question": "Which sentence correctly uses “so” to show a result?", "options": ["The temperature dropped below freezing, so the pond froze overnight.", "The temperature dropped below freezing so, the pond froze overnight.", "The temperature dropped, below freezing so the pond froze overnight.", "The temperature dropped below freezing, the pond froze overnight."], "answer": 0, "explanation": "The second independent clause is a result of the first, and comma + so is correct."}, {"question": "Why is this sentence simple? “The student opened the notebook and began writing.”", "options": ["It has no verb.", "It has a compound subject.", "It has one subject with a compound predicate.", "It contains two independent clauses."], "answer": 2, "explanation": "The one subject, “The student,” performs two actions: opened and began."}, {"question": "Which revision correctly fixes the comma splice? “The storm ended, the players returned to the field.”", "options": ["The storm ended, and the players returned to the field.", "The storm ended and, the players returned to the field.", "The storm, ended and the players returned to the field.", "The storm ended, the players and returned to the field."], "answer": 0, "explanation": "The two independent clauses are correctly joined with comma + and."}, {"question": "What is the best test for deciding whether a comma is needed before a FANBOYS conjunction?", "options": ["Check whether both sides of the conjunction are independent clauses.", "Check whether the sentence contains two verbs anywhere.", "Check whether the sentence has more than ten words.", "Check whether the conjunction is near the middle of the sentence."], "answer": 0, "explanation": "The key question is whether both sides can stand alone as complete sentences."}];let answered=0,score=0,responses=Array(questions.length).fill(null);const quiz=document.getElementById("quiz"),fill=document.getElementById("fill"),status=document.getElementById("status"),results=document.getElementById("results");
function render(){quiz.innerHTML="";questions.forEach((x,i)=>{const c=document.createElement("section");c.className="card";c.innerHTML=`<div class="num">Question ${i+1}</div><div class="q">${x.question}</div><div class="options">${x.options.map((o,j)=>`<button class="option" data-q="${i}" data-o="${j}">${String.fromCharCode(65+j)}. ${o}</button>`).join("")}</div><div id="fb-${i}" class="feedback"></div>`;quiz.appendChild(c)});document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",choose))}
function choose(e){const b=e.currentTarget,qi=+b.dataset.q,oi=+b.dataset.o;if(responses[qi]!==null)return;responses[qi]=oi;answered++;const x=questions[qi],card=b.closest(".card"),buttons=card.querySelectorAll(".option"),fb=document.getElementById(`fb-${qi}`);buttons.forEach((btn,j)=>{btn.disabled=true;if(j===x.answer)btn.classList.add("correct")});if(oi===x.answer){score++;fb.className="feedback show good";fb.innerHTML="<strong>Correct!</strong> "+x.explanation}else{b.classList.add("wrong");fb.className="feedback show bad";fb.innerHTML="<strong>Not quite.</strong> "+x.explanation}update();if(answered===questions.length)finish()}
function update(){fill.style.width=(answered/questions.length*100)+"%";status.textContent=`${answered} of ${questions.length} answered`}
function finish(){const pct=Math.round(score/questions.length*100);document.getElementById("score").textContent=`${score}/${questions.length} (${pct}%)`;document.getElementById("message").textContent=pct>=90?"Excellent — strong mastery of compound sentences.":pct>=80?"Great job — review the few you missed.":pct>=70?"Good progress — review simple vs. compound sentences and comma placement.":"Keep practicing — focus on independent clauses, compound predicates, and comma + FANBOYS.";results.classList.add("show");results.scrollIntoView({behavior:"smooth"})}
function restart(){answered=0;score=0;responses=Array(questions.length).fill(null);results.classList.remove("show");render();update();window.scrollTo({top:0,behavior:"smooth"})}
render();update();
</script></body></html>
